<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Sana ❤️</title>

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffe6f0, #ffd6e7);
      overflow: hidden;
    }

    h1 {
      margin-top: 80px;
      color: #ff3385;
      font-size: 32px;
    }

    .cat {
      width: 220px;
      margin-top: 20px;
    }

    .heart {
      font-size: 30px;
      color: red;
      animation: beat 1s infinite;
      margin: 15px;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    .btn {
      padding: 12px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 20px;
    }

    #yes {
      background-color: #ff3385;
      color: white;
    }

    #no {
      background-color: gray;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

  <h1>Sana, will you be mine? 💖</h1>

  <img class="cat" src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif">

  <div class="heart">❤️ ❤️ ❤️</div>

  <button id="yes" class="btn">Yes 💕</button>
  <button id="no" class="btn">No 😢</button>

  <script>
    const noBtn = document.getElementById("no");

    // Move NO button
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // Disable clicking NO
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
    });

    // YES button click
    document.getElementById("yes").onclick = function() {

      // 🎉 Confetti Blast
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 }
      });

      // Change page after small delay
      setTimeout(() => {
        document.body.innerHTML = `
          <h1 style="margin-top:100px; color:#ff3385;">
            I knoww uhh love mehh 💖<br><br>
            I luv uhh too 😘
          </h1>

          <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" width="250">

          <div style="font-size:25px; margin-top:20px;">❤️ Forever ❤️</div>
        `;
      }, 800);
    };
  </script>

</body>
</html>
